# MailFlow behind an external reverse proxy running on a DIFFERENT host.
#
# For the case where TLS is already solved somewhere else entirely — a Traefik or nginx on another
# machine, a k3s cluster, a hardware appliance — and this Docker host just needs to expose a plain
# HTTP port for it to point at.
#
#   docker compose -f docker-compose.proxy.yml up -d
#
# Against docker-compose.ghcr.yml this drops Caddy, Let's Encrypt, the self-signed certificate
# volume, and the HTTPS port. It publishes exactly ONE port and nothing else.
#
# ── Required in .env ─────────────────────────────────────────────────────────────────────────────
#   APP_URL             https://mail.example.com — the URL users type, NOT this host:port.
#                       Session cookies are `secure: 'auto'` behind `trust proxy: 1`, so they are
#                       set from the proxy's X-Forwarded-Proto. An http:// value here produces a
#                       login that never stays logged in, which is a confusing way to find out.
#   SESSION_SECRET, DB_PASSWORD, ENCRYPTION_KEY
#
# ── Optional ─────────────────────────────────────────────────────────────────────────────────────
#   APP_HTTP_PORT          default 8080 — the host port your proxy points at
#   BIND_ADDR              default 0.0.0.0 — set to one NIC's address to stop the port being
#                          reachable from every network this host is on
#   MAILFLOW_IMAGE_OWNER   default nebriv
#   MAILFLOW_VERSION       default main — the tip, rebuilt on every merge; 'sha-1a2b3c4' pins one
#
# ── Pointing the proxy at it ─────────────────────────────────────────────────────────────────────
# The upstream is `http://<this-host>:8080`. Your proxy must send X-Forwarded-Proto: https —
# Traefik and nginx both do by default when terminating TLS. In k3s, this host is outside the
# cluster, so it is a Service with no selector plus a matching EndpointSlice (or an ExternalName),
# not something Traefik's Docker provider can discover: there is no Docker socket for it to watch
# here, which is why this file carries no Traefik labels.
#
# ── The hop is plaintext ─────────────────────────────────────────────────────────────────────────
# Traffic between the proxy host and this one is unencrypted HTTP over your network, and it carries
# session cookies and mail. That is usually fine on a trusted LAN and is worth knowing rather than
# discovering. To encrypt it, publish 443 instead of 80 (the image self-generates a certificate on
# startup) and point the proxy at https:// with certificate verification disabled — see the
# commented port below.

services:

  # ── Frontend (nginx — serves the SPA and proxies /api to the backend) ────────
  # The only service that publishes anything.
  frontend:
    image: ghcr.io/${MAILFLOW_IMAGE_OWNER:-nebriv}/mailflow-frontend:${MAILFLOW_VERSION:-main}
    container_name: mailflow-frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${APP_HTTP_PORT:-8080}:80"
      # Encrypted hop instead: publish the container's 443 (self-signed, generated at startup) and
      # point the proxy at https:// with verification off.
      # - "${BIND_ADDR:-0.0.0.0}:${APP_HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailflow

  # ── Backend API ──────────────────────────────────────────────────────────────
  # Publishes nothing. Reached only by the frontend's nginx over the internal network.
  backend:
    image: ghcr.io/${MAILFLOW_IMAGE_OWNER:-nebriv}/mailflow-backend:${MAILFLOW_VERSION:-main}
    container_name: mailflow-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      # The external URL users type — not this host's IP and port. See the header.
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      DB_HOST: postgres
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      # ── Bundles and Sweep ────────────────────────────────────────────────────
      # These must be listed here to reach the container. `environment:` is an allowlist, not a
      # passthrough — a BUNDLES_* key in .env alone is read for interpolation and then ignored,
      # which would silently leave the dry run OFF while looking configured.
      #
      # Start with the dry run ON. The classifier runs on real mail and writes nothing to the mail
      # server; the report in the inbox shows what it would have done. Turn it off only once that
      # list has been clean for 14 days (GATE 1). See docs/bundles-and-sweep/DESIGN.md.
      BUNDLES_DRY_RUN: ${BUNDLES_DRY_RUN:-true}
      # Senders that matter but are never replied to, so the derived never-bundle set cannot find
      # them. Addresses or bare domains, comma-separated. Expected size: 5–10.
      BUNDLES_NEVER_BUNDLE: ${BUNDLES_NEVER_BUNDLE:-}
      BUNDLES_ROW_BUDGET: ${BUNDLES_ROW_BUDGET:-7}
      BUNDLES_KEEP_DECAY_SWEEPS: ${BUNDLES_KEEP_DECAY_SWEEPS:-3}
      BUNDLES_AUTOFILE_AGE_DAYS: ${BUNDLES_AUTOFILE_AGE_DAYS:-7}
      BUNDLES_MIN_GROUP_SIZE: ${BUNDLES_MIN_GROUP_SIZE:-3}
      BUNDLES_UNDO_WINDOW_SECONDS: ${BUNDLES_UNDO_WINDOW_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailflow

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

  # ── Redis (sessions + caching) ───────────────────────────────────────────────
  # Persisted deliberately: sessions live here, so an unpersisted Redis logs you out of every
  # device on any restart — including an image update.
  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailflow

volumes:
  postgres_data:
  redis_data:

networks:
  mailflow:
    driver: bridge
