name: Publish main to GHCR

# Continuous image builds for this fork.
#
# Upstream's publish.yml only fires on a `v*.*.*` tag, which is right for releases but means a merge
# to main produces nothing deployable — you have to remember to cut a tag. This builds and pushes on
# every push to main instead, so "merged" and "deployable" are the same event.
#
# Images are tagged `:main` (always the tip) and `:sha-<short>` (immutable, for pinning and for
# rolling back to a known-good build). Release tags keep going through publish.yml with the usual
# semver tags — the two do not overlap.
#
# Pull with:
#   MAILFLOW_IMAGE_OWNER=${{ github.repository_owner }} MAILFLOW_VERSION=main docker compose pull

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A second push while a build is running makes the first one pointless — cancel it rather than
# racing two builds to the same `:main` tag.
concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # linux/arm64 is emulated here; it is what makes the images runnable on a Pi or an ARM VPS.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ── Backend ─────────────────────────────────────────────────────────────

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mailflow-backend:main
            ghcr.io/${{ github.repository_owner }}/mailflow-backend:sha-${{ steps.sha.outputs.short }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ────────────────────────────────────────────────────────────

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mailflow-frontend:main
            ghcr.io/${{ github.repository_owner }}/mailflow-frontend:sha-${{ steps.sha.outputs.short }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/mailflow-backend:sha-${{ steps.sha.outputs.short }}"
            echo "ghcr.io/${{ github.repository_owner }}/mailflow-frontend:sha-${{ steps.sha.outputs.short }}"
            echo '```'
            echo
            echo "Also tagged \`:main\`."
          } >> "$GITHUB_STEP_SUMMARY"
